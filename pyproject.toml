[project]
name = "solver"
version = "1.1.0"
description = "Solver for create the best schedule"
readme = "README.md"
authors = [
    { name = "Akhmad Ardiansyah Amnur", email = "akhmad.ardiansyah1711@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ortools>=9.15.6755",
]

[project.scripts]
solver = "solver:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "keyrings-google-artifactregistry-auth>=1.1.2",
    "pytest>=9.1.1",
]

[[tool.uv.index]]
name = "gcp-artifact-registry"
url = "https://asia-southeast2-python.pkg.dev/schedovyn-509002/schedovyn-engine/simple/"
publish-url = "https://asia-southeast2-python.pkg.dev/schedovyn-509002/schedovyn-engine/"

[tool.uv.sources]
solver = { index = "gcp-artifact-registry" }
